<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INTC — THE FIRST ELITE EDITION</title>
  <meta
    name="description"
    content="INTC — THE FIRST ELITE EDITION. Luxury Elite Football Jersey."
  >

  <style>
    /* =========================================================
       INTC — THE FIRST ELITE EDITION
       COMPLETE SINGLE-FILE WEBSITE
       ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap');

    :root {
      --black: #080808;
      --black-2: #111111;
      --black-3: #181818;
      --white: #f7f7f4;
      --white-2: #e8e8e3;
      --gray: #999994;
      --gray-2: #5d5d59;
      --line: rgba(255,255,255,.13);
      --turquoise: #1dc8c1;
      --danger: #e55b5b;
      --max: 1440px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      min-width: 320px;
      background: var(--black);
      color: var(--white);
      font-family: Inter, Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================================================
       GLOBAL
       ========================================================= */

    .container {
      width: min(calc(100% - 48px), var(--max));
      margin: 0 auto;
    }

    .section {
      padding: 130px 0;
      border-top: 1px solid var(--line);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 55px;
    }

    .section-number {
      color: var(--turquoise);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: Oswald, Arial, sans-serif;
      font-size: clamp(48px, 8vw, 112px);
      line-height: .86;
      font-weight: 600;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .section-description {
      max-width: 390px;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: .3px;
    }

    .eyebrow {
      color: var(--turquoise);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .muted {
      color: var(--gray);
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 78px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(8,8,8,.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(calc(100% - 48px), var(--max));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: Oswald, Arial, sans-serif;
      font-size: 29px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--turquoise);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .cart-button {
      position: relative;
      height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .cart-count {
      display: inline-flex;
      min-width: 18px;
      height: 18px;
      margin-left: 8px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--turquoise);
      color: #000;
      font-size: 9px;
      font-weight: 900;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .menu-button span {
      width: 16px;
      height: 1px;
      background: var(--white);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      min-height: 100svh;
      padding-top: 78px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 75% 50%,
          rgba(29,200,193,.07),
          transparent 28%
        ),
        linear-gradient(
          90deg,
          rgba(8,8,8,1) 0%,
          rgba(8,8,8,.94) 45%,
          rgba(8,8,8,.65) 100%
        );
      pointer-events: none;
    }

    .hero-inner {
      width: min(calc(100% - 48px), var(--max));
      margin: 0 auto;
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
    }

    .hero-code {
      margin-bottom: 25px;
      color: var(--turquoise);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .hero-title {
      font-family: Oswald, Arial, sans-serif;
      font-size: clamp(68px, 10vw, 160px);
      line-height: .82;
      font-weight: 600;
      letter-spacing: -5px;
      text-transform: uppercase;
    }

    .hero-title .outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(247,247,244,.75);
    }

    .hero-subtitle {
      margin-top: 35px;
      color: var(--white-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.7px;
    }

    .hero-price {
      margin-top: 20px;
      font-family: Oswald, Arial, sans-serif;
      font-size: 31px;
      letter-spacing: -.5px;
    }

    .hero-price small {
      color: var(--gray);
      font-family: Inter, Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .hero-actions {
      margin-top: 35px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-button {
      min-height: 54px;
      padding: 0 29px;
      border: 1px solid var(--white);
      background: var(--white);
      color: var(--black);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .25s ease;
    }

    .primary-button:hover {
      background: var(--turquoise);
      border-color: var(--turquoise);
    }

    .secondary-button {
      min-height: 54px;
      padding: 0 29px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .25s ease;
    }

    .secondary-button:hover {
      border-color: var(--white);
    }

    .hero-visual {
      min-height: 610px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-visual-placeholder {
      width: min(100%, 590px);
      aspect-ratio: 1 / 1.05;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.075),
          rgba(255,255,255,.015) 45%,
          transparent 70%
        );
    }

    .hero-visual-placeholder::before {
      content: "IMAGE";
      position: absolute;
      top: 22px;
      right: 22px;
      color: rgba(255,255,255,.3);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .placeholder-jersey {
      width: 48%;
      aspect-ratio: .72;
      border: 2px solid rgba(255,255,255,.22);
      border-radius: 22px 22px 12px 12px;
      transform: rotate(-4deg);
      position: relative;
      opacity: .8;
    }

    .placeholder-jersey::before,
    .placeholder-jersey::after {
      content: "";
      position: absolute;
      top: 8%;
      width: 30%;
      height: 40%;
      border: 2px solid rgba(255,255,255,.22);
    }

    .placeholder-jersey::before {
      left: -27%;
      transform: rotate(28deg);
    }

    .placeholder-jersey::after {
      right: -27%;
      transform: rotate(-28deg);
    }

    .hero-meta {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      color: var(--gray);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* =========================================================
       EDITION
       ========================================================= */

    .edition {
      background: #0b0b0b;
    }

    .edition-grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 80px;
      align-items: end;
    }

    .edition-main {
      max-width: 850px;
    }

    .edition-big {
      font-family: Oswald, Arial, sans-serif;
      font-size: clamp(45px, 7vw, 100px);
      line-height: .9;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: -2px;
    }

    .edi
