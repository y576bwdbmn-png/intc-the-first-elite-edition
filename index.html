<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INTC — THE FIRST ELITE EDITION</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #05070a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;

      background: rgba(5, 7, 10, 0.88);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      z-index: 1000;
    }

    .nav {
      width: min(1180px, calc(100% - 40px));
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.2em;
    }

    .menu-button {
      width: 44px;
      height: 44px;

      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);

      background: transparent;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hamburger {
      width: 18px;
      height: 1px;
      background: white;
      position: relative;
    }

    .hamburger::before,
    .hamburger::after {
      content: "";
      position: absolute;
      left: 0;

      width: 18px;
      height: 1px;

      background: white;
    }

    .hamburger::before {
      top: -6px;
    }

    .hamburger::after {
      top: 6px;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      position: fixed;
      top: 76px;
      right: 0;

      width: min(350px, 100%);

      background: #090d13;

      border-left: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);

      padding: 20px;

      transform: translateY(-120%);
      transition: 0.3s ease;

      z-index: 999;
    }

    .menu.active {
      transform: translateY(0);
    }

    .menu a {
      display: block;

      padding: 18px 0;

      border-bottom: 1px solid rgba(255,255,255,0.08);

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 0.15em;
    }

    /* =========================
       GENERAL
    ========================= */

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
    }

    section {
      padding: 120px 0;
    }

    .kicker {
      color: #19c8e8;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.25em;
    }

    h2 {
      margin-top: 12px;

      font-size: clamp(38px, 6vw, 70px);

      line-height: 0.95;

      letter-spacing: -0.05em;
    }

    .muted {
      color: #9ca6b2;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding-top: 120px;

      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 600px;
      height: 600px;

      right: -250px;
      top: 100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(25,200,232,0.08),
          transparent 70%
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 850px;
    }

    .hero-label {
      color: #19c8e8;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.3em;

      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(58px, 10vw, 115px);

      line-height: 0.86;

      letter-spacing: -0.07em;

      font-weight: 900;
    }

    .hero-subtitle {
      margin-top: 28px;

      font-size: 13px;

      letter-spacing: 0.2em;

      color: #c8ced5;

      font-weight: 700;
    }

    .price {
      margin-top: 24px;

      font-size: 23px;

      font-weight: 900;
    }

    .price span {
      font-size: 10px;

      color: #8e98a4;

      margin-left: 7px;

      letter-spacing: 0.15em;
    }

    .cta {
      margin-top: 30px;

      padding: 16px 25px;

      background: #ffffff;
      color: #000000;

      border: none;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.15em;
    }

    /* =========================
       EDITION
    ========================= */

    .edition {
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .edition-grid {
      margin-top: 60px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 80px;
    }

    .edition-word {
      font-size: clamp(55px, 9vw, 110px);

      font-weight: 900;

      letter-spacing: -0.07em;

      line-height: 0.85;
    }

    .edition-copy {
      max-width: 450px;
    }

    .edition-copy h3 {
      font-size: 25px;

      margin-bottom: 20px;
    }

    .edition-copy p {
      color: #9ca6b2;

      line-height: 1.7;

      font-size: 14px;
    }

    /* =========================
       JERSEY GALLERY
    ========================= */

    .gallery-section {
      margin-top: 65px;
    }

    .gallery-header {
      display: flex;

      justify-content: space-between;
      align-items: end;

      margin-bottom: 18px;
    }

    .gallery-header h3 {
      font-size: 20px;

      letter-spacing: 0.08em;
    }

    .gallery-header span {
      color: #89939f;

      font-size: 10px;

      letter-spacing: 0.15em;
    }

    .gallery {
      display: flex;

      gap: 15px;

      overflow-x: auto;

      scroll-snap-type: x mandatory;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    .gallery-card {
      flex: 0 0 min(78vw, 430px);

      aspect-ratio: 4 / 5;

      background: #0c121a;

      border: 1px solid rgba(255,255,255,0.1);

      scroll-snap-align: start;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #66717e;

      text-align: center;
    }

    .gallery-card strong {
      display: block;

      color: #d0d6dd;

      margin-bottom: 8px;

      font-size: 13px;

      letter-spacing: 0.15em;
    }

    .gallery-controls {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 12px;
    }

    .arrow {
      width: 40px;
      height: 40px;

      background: transparent;

      border: 1px solid rgba(255,255,255,0.12);

      color: white;
    }

    /* =========================
       SIZE
    ========================= */

    .size-table-wrapper {
      margin-top: 45px;

      overflow-x: auto;

      border: 1px solid rgba(255,255,255,0.1);
    }

    table {
      width: 100%;

      min-width: 500px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px;

      text-align: left;

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    th {
      font-size: 10px;

      color: #8e98a4;

      letter-spacing: 0.15em;
    }

    td {
      font-size: 13px;
    }

    /* =========================
       BUILD
    ========================= */

    .build {
      background: #080c12;

      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .form-grid {
      margin-top: 45px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 18px;
    }

    .field {
      background: #0c121a;

      border: 1px solid rgba(255,255,255,0.1);

      padding: 20px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;

      color: #8e98a4;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 0.18em;

      margin-bottom: 12px;
    }

    .choices {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .choice {
      padding: 12px 16px;

      background: transparent;

      color: white;

      border: 1px solid rgba(255,255,255,0.12);

      font-size: 11px;

      font-weight: 800;
    }

    .choice.active {
      border-color: #19c8e8;

      color: #19c8e8;
    }

    select,
    input {
      width: 100%;

      padding: 4px 0;

      background: transparent;

      border: none;

      outline: none;

      color: white;
    }

    select option {
      background: #111820;
    }

    .hidden {
      display: none;
    }

    .add-cart {
      width: 100%;

      margin-top: 18px;

      padding: 17px;

      background: white;

      color: black;

      border: none;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 0.15em;
    }

    /* =========================
       CART
    ========================= */

    .cart {
      margin-top: 55px;
    }

    .cart-item {
      display: grid;

      grid-template-columns: 1fr auto;

      gap: 20px;

      padding: 20px 0;

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .cart-title {
      font-weight: 900;
    }

    .cart-meta {
      margin-top: 7px;

      color: #89939f;

      font-size: 11px;

      line-height: 1.7;
    }

    .cart-actions button {
      background: transparent;

      border: none;

      color: white;

      font-size: 10px;

      letter-spacing: 0.1em;

      margin-left: 10px;
    }

    .cart-total {
      display: flex;

      justify-content: space-between;

      padding: 25px 0;

      font-size: 21px;

      font-weight: 900;
    }

    /* =========================
       CUSTOMER
    ========================= */

    .customer {
      max-width: 760px;
    }

    /* =========================
       REVIEW
    ========
