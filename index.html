<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTC — THE FIRST ELITE EDITION</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f5f5f2;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      min-height: 100vh;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .content {
      max-width: 900px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 50px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(55px, 10vw, 120px);
      line-height: 0.85;
      letter-spacing: -6px;
    }

    p {
      margin-top: 35px;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .price {
      margin-top: 25px;
      font-size: 24px;
      font-weight: 700;
    }

    .button {
      display: inline-flex;
      margin-top: 30px;
      padding: 18px 30px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <div class="logo">
        INTC
      </div>

      <div class="eyebrow">
        INTC / 001
      </div>

      <h1>
        THE FIRST<br>
        ELITE EDITION
      </h1>

      <p>
        LUXURY ELITE FOOTBALL JERSEY
      </p>

      <div class="price">
        ฿459 / JERSEY
      </div>

      <a
        class="button"
        href="#"
      >
        PRE-ORDER
      </a>

    </div>

  </section>

</body>
</html>
